<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blog Post - My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Edit Blog Post</h1>

    {% if error %}
    <div class="error">
        <p><strong>Fehler:</strong> {{ error }}</p>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('update', post_id=post['id']) }}" class="form">
        <div class="form-group">
            <label for="author">Author:</label>
            <input type="text" id="author" name="author" required placeholder="Dein Name" value="{{ post['author'] }}">
        </div>

        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required placeholder="Titel des Beitrags" value="{{ post['title'] }}">
        </div>

        <div class="form-group">
            <label for="content">Content:</label>
            <textarea id="content" name="content" required placeholder="Schreibe deinen Beitrag hier..." rows="8">{{ post['content'] }}</textarea>
        </div>

        <button type="submit" class="btn-submit">Beitrag aktualisieren</button>
    </form>

    <p><a href="{{ url_for('index') }}">← Zurück zur Startseite</a></p>
</body>
</html>
