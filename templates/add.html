<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Post - My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Add New Blog Post</h1>
    
    {% if error %}
    <div class="error">
        <p><strong>Fehler:</strong> {{ error }}</p>
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('add') }}" class="form">
        <div class="form-group">
            <label for="author">Author:</label>
            <input type="text" id="author" name="author" required placeholder="Dein Name">
        </div>
        
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required placeholder="Titel des Beitrags">
        </div>
        
        <div class="form-group">
            <label for="content">Content:</label>
            <textarea id="content" name="content" required placeholder="Schreibe deinen Beitrag hier..." rows="8"></textarea>
        </div>
        
        <button type="submit" class="btn-submit">Post erstellen</button>
    </form>
    
    <p><a href="{{ url_for('index') }}">← Zurück zur Startseite</a></p>
</body>
</html>
