<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>
    <p><a href="{{ url_for('add') }}" class="btn-add">+ Neuen Beitrag erstellen</a></p>
    
    {% for post in posts %}
    <div class="post">
        <div class="post-header">
            <h2>{{ post.title }}</h2>
            <a href="{{ url_for('delete', post_id=post.id) }}" class="btn-delete" onclick="return confirm('Möchtest du diesen Beitrag wirklich löschen?');">Löschen</a>
        </div>
        <p><em>Written by {{ post.author }}</em></p>
        <p>{{ post.content }}</p>
    </div>
    {% endfor %}
</body>
</html>
